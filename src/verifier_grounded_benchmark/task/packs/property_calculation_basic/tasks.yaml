tasks:
- task_id: property_calc_easy_001_toluene_aqueous_solvation_free_energy
  version: 1
  task_type: property_calculation
  object_type: molecular_solvation_property
  difficulty: basic
  formal_track: true
  capability_tags:
  - property_calculation
  - fixed_input
  - solvation
  - free_energy
  prompt: |
    For toluene (SMILES: Cc1ccccc1), report the aqueous solvation free energy in kcal/mol.

    Your final answer must appear on its own line exactly in this format:
    FINAL ANSWER: {"answer":<number>,"unit":"kcal/mol"}
  answer_schema:
    format: final_answer_line
    final_answer_prefix: 'FINAL ANSWER:'
    value_type: json
    cardinality: one
  input_objects:
  - object_id: toluene_molecule
    type: smiles
    presentation: prompt_inline
    value: Cc1ccccc1
  requested_properties:
  - name: aqueous_solvation_free_energy
    value_type: number
    comparison_group: aqueous_solvation_free_energy
    unit: kcal/mol
