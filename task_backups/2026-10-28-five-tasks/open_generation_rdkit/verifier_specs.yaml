verifiers:
- verifier_id: rdkit_hba_v1
  name: RDKit Hydrogen-Bond Acceptor Descriptor Verifier
  version: 1
  verifier_image: verifier-grounded:dev
  descriptor: hba
  resources: &id001
    cpu: 1
    memory_mb: 1024
  backend: &id002
    type: rdkit_descriptors
  package_versions: &id003
    rdkit: 2026.3.2
  domain: &id004
    allowed_elements:
    - H
    - B
    - C
    - N
    - O
    - F
    - P
    - S
    - Cl
    - Br
    - I
    heavy_atom_count:
    - 5
    - 60
    mw:
    - 0.0
    - 600.0
    formal_charge:
    - -1
    - 1
  property:
    source: rdkit.Chem.rdMolDescriptors.CalcNumHBA
  failure_policy: &id005
    parse_error: invalid answer JSON shape, missing SMILES, or unparseable SMILES
    validity_error: multi-component SMILES or unsanitizable molecule
    domain_error: outside element, heavy atom, MW, or formal charge domain
  executor:
    type: python_module
    module: verifier_grounded_benchmark.evaluation.open_generation.verifiers.rdkit_descriptors.rdkit_hba
    timeout_seconds: 60
- verifier_id: rdkit_hbd_v1
  name: RDKit Hydrogen-Bond Donor Descriptor Verifier
  version: 1
  verifier_image: verifier-grounded:dev
  descriptor: hbd
  resources: *id001
  backend: *id002
  package_versions: *id003
  domain: *id004
  property:
    source: rdkit.Chem.rdMolDescriptors.CalcNumHBD
  failure_policy: *id005
  executor:
    type: python_module
    module: verifier_grounded_benchmark.evaluation.open_generation.verifiers.rdkit_descriptors.rdkit_hbd
    timeout_seconds: 60
- verifier_id: rdkit_sa_score_v1
  name: RDKit Synthetic Accessibility Descriptor Verifier
  version: 1
  verifier_image: verifier-grounded:dev
  descriptor: sa_score
  resources: *id001
  backend: *id002
  package_versions: *id003
  domain: *id004
  property:
    source: rdkit.Contrib.SA_Score.sascorer.calculateScore
    scoring_range:
    - 1.0
    - 10.0
  failure_policy: *id005
  executor:
    type: python_module
    module: verifier_grounded_benchmark.evaluation.open_generation.verifiers.rdkit_descriptors.rdkit_sa_score
    timeout_seconds: 60
- verifier_id: rdkit_fraction_csp3_v1
  name: RDKit Fraction Csp3 Descriptor Verifier
  version: 1
  verifier_image: verifier-grounded:dev
  descriptor: fraction_csp3
  resources: *id001
  backend: *id002
  package_versions: *id003
  domain: *id004
  property:
    source: rdkit.Chem.rdMolDescriptors.CalcFractionCSP3
    range:
    - 0.0
    - 1.0
  failure_policy: *id005
  executor:
    type: python_module
    module: verifier_grounded_benchmark.evaluation.open_generation.verifiers.rdkit_descriptors.rdkit_fraction_csp3
    timeout_seconds: 60
